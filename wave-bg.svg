  <!-- Layer 1: blurred highlight, then glass pane -->
  <g filter="url(#blur)">
    <g clip-path="url(#cp-hl-1)">
      <rect x="-400" y="0" width="900" height="2000" fill="url(#grad)" opacity="0.5"/>
    </g>
  </g>
  <g clip-path="url(#cp-pane-1)">
    <rect x="-400" y="0" width="900" height="2000" fill="currentColor" opacity="0.246"/>
  </g>
  <!-- Layer 2: blurred highlight, then glass pane -->
  <g filter="url(#blur)">
