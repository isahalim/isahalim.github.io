<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 2000" width="450" height="2000" preserveAspectRatio="xMidYMid slice" style="color: #ffffff;">
  <!--
    Seamless wave background loop.
    Height: 2000px. Animate with translateY(0) -> translateY(-1000px) over the
    loop period and the pattern tiles perfectly:
      - wave shapes repeat every 500px in Y
      - the gradient repeats every 1000px in Y
    So shifting by -1000px lands on an identical configuration.

    Theming: the glass-pane fill uses currentColor. Set `color: #ffffff` on a
    wrapping element for light mode, `color: #1e1e1e` for dark mode.
  -->
  <defs>
