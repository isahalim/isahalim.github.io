<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 2000" width="450" height="2000" preserveAspectRatio="xMidYMid slice" style="color: #ffffff;">
  <!--
    Wave layer 3 of 3. Standalone SVG, 2000px tall, designed to loop seamlessly
    by animating translateY(0) -> translateY(-1000px). The wave shape repeats
    every 500px and the gradient every 1000px, so -1000px lands on an identical
    configuration regardless of animation speed.

    All three layer SVGs share the same viewBox (0 0 450 2000), so stacking them
    in absolutely-positioned containers will overlay them in register, exactly
    matching the original three-wave composition.

    Pane fill uses currentColor: set `color: #ffffff` on a wrapping element for
    light mode, `color: #1e1e1e` for dark mode.
  -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1000"
                    gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0"   stop-color="#2196F3"/>
      <stop offset="0.5" stop-color="#4CAF50"/>
      <stop offset="1"   stop-color="#2196F3"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-5%" width="140%" height="110%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <clipPath id="cp-hl" clipPathUnits="userSpaceOnUse"><polygon points="-400.0,0.0 21.8,0.0 30.2,25.0 40.3,50.0 50.7,75.0 60.0,100.0 67.1,125.0 71.3,150.0 72.5,175.0 70.7,200.0 66.6,225.0 61.3,250.0 55.9,275.0 51.8,300.0 50.4,325.0 52.8,350.0 59.7,375.0 71.6,400.0 88.2,425.0 108.9,450.0 132.7,475.0 158.0,500.0 183.1,525.0 206.2,550.0 225.5,575.0 239.3,600.0 246.6,625.0 246.6,650.0 239.2,675.0 224.7,700.0 204.1,725.0 178.9,750.0 150.8,775.0 121.6,800.0 93.4,825.0 67.9,850.0 46.6,875.0 30.5,900.0 20.2,925.0 15.7,950.0 16.6,975.0 21.8,1000.0 30.2,1025.0 40.3,1050.0 50.7,1075.0 60.0,1100.0 67.1,1125.0 71.3,1150.0 72.5,1175.0 70.7,1200.0 66.6,1225.0 61.3,1250.0 55.9,1275.0 51.8,1300.0 50.4,1325.0 52.8,1350.0 59.7,1375.0 71.6,1400.0 88.2,1425.0 108.9,1450.0 132.7,1475.0 158.0,1500.0 183.1,1525.0 206.2,1550.0 225.5,1575.0 239.3,1600.0 246.6,1625.0 246.6,1650.0 239.2,1675.0 224.7,1700.0 204.1,1725.0 178.9,1750.0 150.8,1775.0 121.6,1800.0 93.4,1825.0 67.9,1850.0 46.6,1875.0 30.5,1900.0 20.2,1925.0 15.7,1950.0 16.6,1975.0 21.8,2000.0 -400.0,2000.0"/></clipPath>
    <clipPath id="cp-pane" clipPathUnits="userSpaceOnUse"><polygon points="-400.0,0.0 6.8,0.0 15.2,25.0 25.3,50.0 35.7,75.0 45.0,100.0 52.1,125.0 56.3,150.0 57.5,175.0 55.7,200.0 51.6,225.0 46.3,250.0 40.9,275.0 36.8,300.0 35.4,325.0 37.8,350.0 44.7,375.0 56.6,400.0 73.2,425.0 93.9,450.0 117.7,475.0 143.0,500.0 168.1,525.0 191.2,550.0 210.5,575.0 224.3,600.0 231.6,625.0 231.6,650.0 224.2,675.0 209.7,700.0 189.1,725.0 163.9,750.0 135.8,775.0 106.6,800.0 78.4,825.0 52.9,850.0 31.6,875.0 15.5,900.0 5.2,925.0 0.7,950.0 1.6,975.0 6.8,1000.0 15.2,1025.0 25.3,1050.0 35.7,1075.0 45.0,1100.0 52.1,1125.0 56.3,1150.0 57.5,1175.0 55.7,1200.0 51.6,1225.0 46.3,1250.0 40.9,1275.0 36.8,1300.0 35.4,1325.0 37.8,1350.0 44.7,1375.0 56.6,1400.0 73.2,1425.0 93.9,1450.0 117.7,1475.0 143.0,1500.0 168.1,1525.0 191.2,1550.0 210.5,1575.0 224.3,1600.0 231.6,1625.0 231.6,1650.0 224.2,1675.0 209.7,1700.0 189.1,1725.0 163.9,1750.0 135.8,1775.0 106.6,1800.0 78.4,1825.0 52.9,1850.0 31.6,1875.0 15.5,1900.0 5.2,1925.0 0.7,1950.0 1.6,1975.0 6.8,2000.0 -400.0,2000.0"/></clipPath>
  </defs>

  <!-- Blurred blue-green highlight -->
  <g filter="url(#blur)">
    <g clip-path="url(#cp-hl)">
      <rect x="-400" y="0" width="900" height="2000" fill="url(#grad)" opacity="0.5"/>
    </g>
  </g>
  <!-- Translucent glass pane -->
  <g clip-path="url(#cp-pane)">
    <rect x="-400" y="0" width="900" height="2000" fill="currentColor" opacity="0.82"/>
  </g>
</svg>
