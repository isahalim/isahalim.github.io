<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 2000" width="450" height="2000" preserveAspectRatio="xMidYMid slice" style="color: #ffffff;">
  <!--
    Wave layer 1 of 3. Standalone SVG, 2000px tall, designed to loop seamlessly
    by animating translateY(0) -> translateY(-1000px). The wave shape repeats
    every 500px and the gradient every 1000px, so -1000px lands on an identical
    configuration regardless of animation speed.

    All three layer SVGs share the same viewBox (0 0 450 2000), so stacking them
    in absolutely-positioned containers will overlay them in register, exactly
    matching the original three-wave composition.

    Pane fill uses currentColor: set `color: #ffffff` on a wrapping element for
    light mode, `color: #1e1e1e` for dark mode.
  -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1000"
                    gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0"   stop-color="#2196F3"/>
      <stop offset="0.5" stop-color="#4CAF50"/>
      <stop offset="1"   stop-color="#2196F3"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-5%" width="140%" height="110%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <clipPath id="cp-hl" clipPathUnits="userSpaceOnUse"><polygon points="-400.0,0.0 240.0,0.0 286.1,25.0 329.3,50.0 366.8,75.0 396.4,100.0 416.5,125.0 426.3,150.0 425.8,175.0 416.0,200.0 398.4,225.0 375.0,250.0 348.3,275.0 320.8,300.0 294.8,325.0 272.2,350.0 254.5,375.0 242.3,400.0 235.8,425.0 234.1,450.0 236.1,475.0 240.0,500.0 243.9,525.0 245.9,550.0 244.2,575.0 237.7,600.0 225.5,625.0 207.8,650.0 185.2,675.0 159.2,700.0 131.7,725.0 105.0,750.0 81.6,775.0 64.0,800.0 54.2,825.0 53.7,850.0 63.5,875.0 83.6,900.0 113.2,925.0 150.7,950.0 193.9,975.0 240.0,1000.0 286.1,1025.0 329.3,1050.0 366.8,1075.0 396.4,1100.0 416.5,1125.0 426.3,1150.0 425.8,1175.0 416.0,1200.0 398.4,1225.0 375.0,1250.0 348.3,1275.0 320.8,1300.0 294.8,1325.0 272.2,1350.0 254.5,1375.0 242.3,1400.0 235.8,1425.0 234.1,1450.0 236.1,1475.0 240.0,1500.0 243.9,1525.0 245.9,1550.0 244.2,1575.0 237.7,1600.0 225.5,1625.0 207.8,1650.0 185.2,1675.0 159.2,1700.0 131.7,1725.0 105.0,1750.0 81.6,1775.0 64.0,1800.0 54.2,1825.0 53.7,1850.0 63.5,1875.0 83.6,1900.0 113.2,1925.0 150.7,1950.0 193.9,1975.0 240.0,2000.0 -400.0,2000.0"/></clipPath>
    <clipPath id="cp-pane" clipPathUnits="userSpaceOnUse"><polygon points="-400.0,0.0 225.0,0.0 271.1,25.0 314.3,50.0 351.8,75.0 381.4,100.0 401.5,125.0 411.3,150.0 410.8,175.0 401.0,200.0 383.4,225.0 360.0,250.0 333.3,275.0 305.8,300.0 279.8,325.0 257.2,350.0 239.5,375.0 227.3,400.0 220.8,425.0 219.1,450.0 221.1,475.0 225.0,500.0 228.9,525.0 230.9,550.0 229.2,575.0 222.7,600.0 210.5,625.0 192.8,650.0 170.2,675.0 144.2,700.0 116.7,725.0 90.0,750.0 66.6,775.0 49.0,800.0 39.2,825.0 38.7,850.0 48.5,875.0 68.6,900.0 98.2,925.0 135.7,950.0 178.9,975.0 225.0,1000.0 271.1,1025.0 314.3,1050.0 351.8,1075.0 381.4,1100.0 401.5,1125.0 411.3,1150.0 410.8,1175.0 401.0,1200.0 383.4,1225.0 360.0,1250.0 333.3,1275.0 305.8,1300.0 279.8,1325.0 257.2,1350.0 239.5,1375.0 227.3,1400.0 220.8,1425.0 219.1,1450.0 221.1,1475.0 225.0,1500.0 228.9,1525.0 230.9,1550.0 229.2,1575.0 222.7,1600.0 210.5,1625.0 192.8,1650.0 170.2,1675.0 144.2,1700.0 116.7,1725.0 90.0,1750.0 66.6,1775.0 49.0,1800.0 39.2,1825.0 38.7,1850.0 48.5,1875.0 68.6,1900.0 98.2,1925.0 135.7,1950.0 178.9,1975.0 225.0,2000.0 -400.0,2000.0"/></clipPath>
  </defs>

  <!-- Blurred blue-green highlight -->
  <g filter="url(#blur)">
    <g clip-path="url(#cp-hl)">
      <rect x="-400" y="0" width="900" height="2000" fill="url(#grad)" opacity="0.5"/>
    </g>
  </g>
  <!-- Translucent glass pane -->
  <g clip-path="url(#cp-pane)">
    <rect x="-400" y="0" width="900" height="2000" fill="currentColor" opacity="0.246"/>
  </g>
</svg>
